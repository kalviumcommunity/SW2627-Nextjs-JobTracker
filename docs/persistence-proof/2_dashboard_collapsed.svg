<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
      .sidebar { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .footer { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #0f172a; font-size: 16px; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; fill: #334155; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .btn { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 4; }
      .tag { fill: #fef3c7; rx: 4; }
      .tag-text { font-family: sans-serif; font-size: 11px; fill: #92400e; font-weight: 600; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" class="bg"/>
  
  <!-- Browser Header Bar -->
  <rect width="800" height="40" fill="#1e293b"/>
  <circle cx="20" cy="20" r="6" fill="#ef4444"/>
  <circle cx="38" cy="20" r="6" fill="#eab308"/>
  <circle cx="56" cy="20" r="6" fill="#22c55e"/>
  <rect x="80" y="8" width="400" height="24" rx="4" fill="#334155"/>
  <text x="95" y="24" font-family="monospace" font-size="12" fill="#94a3b8">http://localhost:3000/dashboard</text>
  <rect x="700" y="10" width="85" height="20" class="tag"/>
  <text x="707" y="24" class="tag-text">Step 2: Collapsed</text>

  <!-- Global Header -->
  <rect y="40" width="800" height="50" class="header"/>
  <text x="30" y="70" class="text-title" fill="#3525cd">Apna Tracker</text>
  <text x="160" y="70" class="text-body" font-weight="600">Home</text>
  <text x="220" y="70" class="text-body">About</text>
  <text x="280" y="70" class="text-title" fill="#3525cd">Dashboard</text>

  <!-- Sidebar (Collapsed - 60px) -->
  <rect y="90" width="60" height="310" class="sidebar"/>
  <rect x="15" y="105" width="30" height="26" class="btn"/>
  <text x="24" y="122" class="text-body" font-size="14">→</text>
  
  <rect x="5" y="180" width="50" height="60" rx="4" fill="#fef3c7"/>
  <text x="10" y="200" font-family="sans-serif" font-size="9" font-weight="700" fill="#92400e">Width</text>
  <text x="10" y="215" font-family="sans-serif" font-size="10" font-weight="700" fill="#78350f">60px</text>

  <!-- Main Content Slot -->
  <rect x="60" y="90" width="740" height="310" fill="#ffffff"/>
  <text x="100" y="140" class="text-title" font-size="24">Dashboard Overview</text>
  <text x="100" y="175" class="text-body">User clicked [Collapse] button -> local state changed to collapsed = true.</text>
  <text x="100" y="205" class="text-muted">Next step: User will click Settings link inside sidebar to navigate.</text>

  <!-- Global Footer -->
  <rect y="400" width="800" height="50" class="footer"/>
  <text x="400" y="430" text-anchor="middle" class="text-muted">© 2026 Our Product • Global Footer rendered by app/layout.tsx</text>
</svg>
