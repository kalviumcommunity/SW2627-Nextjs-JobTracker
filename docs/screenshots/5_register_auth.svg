<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" rx="10" fill="#0f172a" />
  
  <!-- Browser Chrome / Top Bar -->
  <rect x="0" y="0" width="1200" height="80" rx="10" fill="#1e293b" />
  <circle cx="30" cy="40" r="7" fill="#ef4444" />
  <circle cx="52" cy="40" r="7" fill="#f59e0b" />
  <circle cx="74" cy="40" r="7" fill="#10b981" />
  
  <text x="110" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94a3b8">‹</text>
  <text x="135" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94a3b8">›</text>
  <text x="160" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">↻</text>
  
  <!-- Address / URL Bar -->
  <rect x="190" y="22" width="820" height="36" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <text x="210" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#10b981">🔒</text>
  <text x="235" y="45" font-family="monospace" font-size="14" fill="#e2e8f0" font-weight="500">http://localhost:3000/register</text>
  <rect x="910" y="28" width="85" height="24" rx="4" fill="#3b82f6" />
  <text x="922" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="white" font-weight="600">CLEAN URL</text>

  <!-- Page Content Viewport (Auth Layout - #f8fafc full screen, NO header, NO footer) -->
  <rect x="0" y="80" width="1200" height="720" fill="#f8fafc" />
  
  <!-- Centered Card: app/(auth)/layout.tsx -->
  <g transform="translate(410, 200)">
    <!-- Shadow -->
    <rect x="0" y="4" width="380" height="400" rx="12" fill="#000000" opacity="0.08" />
    <!-- Card Surface -->
    <rect x="0" y="0" width="380" height="400" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Group Badge -->
    <rect x="35" y="30" width="220" height="24" rx="12" fill="#eff6ff" />
    <text x="45" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#2563eb">Layout: app/(auth)/layout.tsx</text>

    <!-- Card Title -->
    <text x="35" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Create your account</text>
    
    <!-- Email Input -->
    <rect x="35" y="115" width="310" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="47" y="141" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">you@example.com</text>
    
    <!-- Password Input -->
    <rect x="35" y="170" width="310" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="47" y="196" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94a3b8">Choose a password</text>
    
    <!-- Submit Button -->
    <rect x="35" y="232" width="310" height="42" rx="6" fill="#0f172a" />
    <text x="135" y="258" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Create account</text>

    <!-- Bottom helper note -->
    <text x="35" y="330" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b">
      Centered card with minHeight: 100vh wrapper
    </text>
    <text x="35" y="348" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b">
      Clean URL resolves directly to /register
    </text>
  </g>
</svg>
