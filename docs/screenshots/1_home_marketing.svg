<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Background / Browser Window Shell -->
  <rect width="1200" height="800" rx="10" fill="#0f172a" />
  
  <!-- Browser Chrome / Top Bar -->
  <rect x="0" y="0" width="1200" height="80" rx="10" fill="#1e293b" />
  <!-- Window Controls -->
  <circle cx="30" cy="40" r="7" fill="#ef4444" />
  <circle cx="52" cy="40" r="7" fill="#f59e0b" />
  <circle cx="74" cy="40" r="7" fill="#10b981" />
  
  <!-- Navigation Buttons -->
  <text x="110" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94a3b8">‹</text>
  <text x="135" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94a3b8">›</text>
  <text x="160" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">↻</text>
  
  <!-- Address / URL Bar -->
  <rect x="190" y="22" width="820" height="36" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <!-- Lock Icon -->
  <text x="210" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#10b981">🔒</text>
  <text x="235" y="45" font-family="monospace" font-size="14" fill="#e2e8f0" font-weight="500">http://localhost:3000/</text>
  <rect x="910" y="28" width="85" height="24" rx="4" fill="#3b82f6" />
  <text x="922" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="white" font-weight="600">CLEAN URL</text>

  <!-- Page Content Viewport -->
  <rect x="0" y="80" width="1200" height="720" fill="#ffffff" />
  
  <!-- Marketing Layout: Header -->
  <rect x="0" y="80" width="1200" height="70" fill="#0f172a" />
  <!-- Nav Items -->
  <text x="50" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#ffffff">OurProduct</text>
  <text x="200" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#cbd5e1">About</text>
  <text x="270" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#cbd5e1">Pricing</text>
  <rect x="1060" y="98" width="90" height="34" rx="6" fill="#3b82f6" />
  <text x="1080" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Sign in</text>

  <!-- Main Marketing Body -->
  <g transform="translate(150, 200)">
    <!-- Badge -->
    <rect x="0" y="0" width="230" height="32" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#2563eb">Route Group: app/(marketing)/page.tsx</text>
    
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Build faster, ship sooner</text>
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#475569">
      Marketing landing copy goes here. This page is located at app/(marketing)/page.tsx
    </text>
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#475569">
      and resolves cleanly to the root URL (/) without &quot;(marketing)&quot; appearing anywhere.
    </text>

    <!-- CTAs -->
    <rect x="0" y="210" width="160" height="48" rx="8" fill="#0f172a" />
    <text x="35" y="240" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Get Started</text>
    
    <rect x="180" y="210" width="140" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="215" y="240" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#334155">Pricing</text>
  </g>

  <!-- Marketing Layout: Footer -->
  <rect x="0" y="720" width="1200" height="80" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <text x="600" y="765" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">
    © 2026 OurProduct — Wrapped by app/(marketing)/layout.tsx
  </text>
</svg>
