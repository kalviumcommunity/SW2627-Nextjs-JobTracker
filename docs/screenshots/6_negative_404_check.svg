<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" rx="10" fill="#0f172a" />
  
  <!-- Browser Chrome / Top Bar -->
  <rect x="0" y="0" width="1200" height="80" rx="10" fill="#1e293b" />
  <circle cx="30" cy="40" r="7" fill="#ef4444" />
  <circle cx="52" cy="40" r="7" fill="#f59e0b" />
  <circle cx="74" cy="40" r="7" fill="#10b981" />
  
  <text x="110" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94a3b8">‹</text>
  <text x="135" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94a3b8">›</text>
  <text x="160" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">↻</text>
  
  <!-- Address / URL Bar with Negative Test Query -->
  <rect x="190" y="22" width="820" height="36" rx="18" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
  <text x="210" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#ef4444">⚠️</text>
  <text x="235" y="45" font-family="monospace" font-size="14" fill="#fca5a5" font-weight="500">http://localhost:3000/(marketing)/about</text>
  <rect x="885" y="28" width="110" height="24" rx="4" fill="#ef4444" />
  <text x="895" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="white" font-weight="600">NEGATIVE TEST</text>

  <!-- Page Content Viewport (Next.js 404 Screen) -->
  <rect x="0" y="80" width="1200" height="720" fill="#000000" />
  
  <!-- Centered 404 Message -->
  <g transform="translate(420, 360)">
    <text x="0" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="600" fill="#ffffff">404</text>
    <line x1="80" y1="20" x2="80" y2="60" stroke="#475569" stroke-width="1.5" />
    <text x="105" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#e2e8f0">This page could not be found.</text>
  </g>

  <!-- Explanation Banner -->
  <g transform="translate(300, 480)">
    <rect x="0" y="0" width="600" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="25" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">
      CONFIRMATION: Route Group Names Are Stripped
    </text>
    <text x="25" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#cbd5e1">
      Next.js treats (marketing) as an organizational wrapper and NEVER as a URL segment.
    </text>
    <text x="25" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#cbd5e1">
      Directly visiting /(marketing)/about correctly results in a 404 response.
    </text>
  </g>
</svg>
